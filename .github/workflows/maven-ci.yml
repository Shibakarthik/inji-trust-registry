name: Maven CI

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify with Maven (Testcontainers uses the runner Docker daemon)
        run: mvn --batch-mode --no-transfer-progress clean verify
